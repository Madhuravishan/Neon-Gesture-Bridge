<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Fingertip Connector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #0f1117;
      color: #e8eaed;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    #status { font-size: 0.875rem; color: #9aa0a6; }
    #canvas {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      background: #1a1d26;
    }
    p.hint { font-size: 0.8rem; color: #6b7280; max-width: 640px; text-align: center; padding: 0 1rem; }
  </style>
</head>
<body>
  <h1>Fingertip Connector</h1>
  <p id="status">Loading MediaPipe…</p>
  <canvas id="canvas"></canvas>
  <p class="hint">Show two hands to link matching fingertips with neon lines between them.</p>
  <video id="video" playsinline muted hidden></video>

  <script type="module">
    const MP_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

    const MAX_NUM_HANDS = 2;

    // MediaPipe hand landmark indices for fingertips (thumb → pinky)
    const FINGERTIPS = [4, 8, 12, 16, 20];
    const THUMB_TIP = 4;
    const INDEX_TIP = 8;
    // Normalized image-space distance (0–1); tune if pinch feels too sensitive
    const PINCH_THRESHOLD = 0.06;

    const statusEl = document.getElementById("status");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let handLandmarker = null;
    let lastVideoTime = -1;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function initLandmarker() {
      const { HandLandmarker, FilesetResolver } = await import(MP_CDN);
      const vision = await FilesetResolver.forVisionTasks(`${MP_CDN}/wasm`);
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: MODEL_URL,
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: MAX_NUM_HANDS,
      });
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function landmarkToPixel(lm) {
      return { x: lm.x * canvas.width, y: lm.y * canvas.height };
    }

    function thumbIndexDistance(landmarks) {
      const thumb = landmarks[THUMB_TIP];
      const index = landmarks[INDEX_TIP];
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      return Math.hypot(dx, dy);
    }

    function isPinchGesture(landmarks) {
      return thumbIndexDistance(landmarks) < PINCH_THRESHOLD;
    }

    const NEON_PALETTE = [
      { stroke: "#00ffff", glow: "#00ffff" },
      { stroke: "#ff00ff", glow: "#ff00ff" },
      { stroke: "#39ff14", glow: "#39ff14" },
    ];

    const NEON_RED = { stroke: "#ff2244", glow: "#ff0000" };

    // One vibrant neon color per finger pair (thumb, index, middle, ring, pinky)
    const CROSS_HAND_COLORS = [
      { stroke: "#00ffff", glow: "#00ffff" },
      { stroke: "#ff00ff", glow: "#ff00ff" },
      { stroke: "#39ff14", glow: "#39ff14" },
      { stroke: "#ffaa00", glow: "#ff8800" },
      { stroke: "#7df9ff", glow: "#00bfff" },
    ];

    function drawNeonLine(x1, y1, x2, y2, color) {
      ctx.save();
      ctx.lineCap = "round";

      ctx.shadowBlur = 24;
      ctx.shadowColor = color.glow;
      ctx.strokeStyle = color.stroke;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.shadowBlur = 10;
      ctx.shadowColor = color.glow;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.restore();
    }

    function drawNeonDot(x, y, color) {
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = color.glow;
      ctx.fillStyle = color.stroke;
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 6;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCrossHandFingertipLines(hand0, hand1) {
      for (let i = 0; i < FINGERTIPS.length; i++) {
        const landmarkIndex = FINGERTIPS[i];
        const a = landmarkToPixel(hand0[landmarkIndex]);
        const b = landmarkToPixel(hand1[landmarkIndex]);
        drawNeonLine(a.x, a.y, b.x, b.y, CROSS_HAND_COLORS[i]);
      }
    }

    function drawFingertipLines(landmarks, isPinch) {
      const tips = FINGERTIPS.map((i) => landmarkToPixel(landmarks[i]));
      let colorIndex = 0;

      for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
          const color = isPinch
            ? NEON_RED
            : NEON_PALETTE[colorIndex % NEON_PALETTE.length];
          drawNeonLine(tips[i].x, tips[i].y, tips[j].x, tips[j].y, color);
          colorIndex++;
        }
      }

      tips.forEach((tip, i) => {
        const color = isPinch ? NEON_RED : NEON_PALETTE[i % NEON_PALETTE.length];
        drawNeonDot(tip.x, tip.y, color);
      });
    }

    function drawGestureLabel(isPinch) {
      const label = isPinch ? "Gesture: PINCH" : "Gesture: OPEN";
      ctx.save();
      ctx.font = "bold 28px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.shadowBlur = 20;
      ctx.shadowColor = isPinch ? NEON_RED.glow : "#00ffff";
      ctx.fillStyle = isPinch ? NEON_RED.stroke : "#e8eaed";
      ctx.fillText(label, canvas.width / 2, 24);
      ctx.restore();
    }

    function render() {
      if (!handLandmarker || video.readyState < 2) {
        requestAnimationFrame(render);
        return;
      }

      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = handLandmarker.detectForVideo(video, now);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let primaryPinch = false;
        const multiHandLandmarks = result.landmarks ?? [];

        if (multiHandLandmarks.length > 0) {
          primaryPinch = isPinchGesture(multiHandLandmarks[0]);
          setStatus(`${multiHandLandmarks.length} hand(s) detected`);

          for (const hand of multiHandLandmarks) {
            drawFingertipLines(hand, isPinchGesture(hand));
          }

          if (multiHandLandmarks.length === MAX_NUM_HANDS) {
            drawCrossHandFingertipLines(
              multiHandLandmarks[0],
              multiHandLandmarks[1]
            );
          }
        } else {
          setStatus("Show your hand to the camera");
        }
        ctx.restore();

        if (multiHandLandmarks.length > 0) {
          drawGestureLabel(primaryPinch);
        }
      }

      requestAnimationFrame(render);
    }

    async function main() {
      try {
        await initLandmarker();
        setStatus("Starting camera…");
        await startCamera();
        setStatus("Ready — show your hand");
        render();
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message}`);
      }
    }

    main();
  </script>
</body>
</html>
